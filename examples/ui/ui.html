<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Anabeeb</title>
    <link rel="stylesheet" href="ui.css" />
    <script>
        window.anabeeb = {
            host: "localhost",
            port: 4040,
        };
    </script>
    <script src="anabeeb.js"></script>
</head>
<body>
<h1>Anabeeb</h1>

<div class="elements">
    <div class="column">
        <div>
            <label><input type="checkbox" id="coupler1" class="stop" /><span>Coupler 1</span></label>
        </div>

        <div>
            <label><input type="checkbox" id="coupler2" class="stop" /><span>Coupler 2</span></label>
        </div>

        <div>
            <label><input type="checkbox" id="filter2" class="stop" /><span>Filter 2</span></label>
        </div>

        <div>
            <label><input type="range" id="filter1" class="slider" /><span>Filter 1</span></label>
        </div>
    </div>
    <div class="column">
        <div>
            <label><input type="button" id="combination" class="stop" /><span>C 1</span></label>
        </div>

        <div>
            <label><input type="checkbox" id="captor" class="stop" /><span>Set</span></label>
        </div>

        <div>
            <label><input type="number" id="memory" class="counter" /><span>Memory</span></label>
        </div>
    </div>
</div>

<section id="errors" role="alert" aria-live="assertive" aria-atomic="true">
    <p>🚨 Could not connect to the organ server,
       <a href="" onclick="location.reload(); return false;">refresh</a> to try again.
    </p>
</section>

</body>
</html>
